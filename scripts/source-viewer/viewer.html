<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://esm.sh; style-src 'unsafe-inline'; connect-src https://esm.sh">
<title>Sample source: {{ROUTE_TITLE}}</title>
<style>
:root { color-scheme: light dark; --bg: #fff; --fg: #24292f; --border: #d0d7de; --accent: #0969da; }
html[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --border: #30363d; --accent: #58a6ff; color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { --bg: #0d1117; --fg: #e6edf3; --border: #30363d; --accent: #58a6ff; } }
* { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; border-bottom: 1px solid var(--border); gap: 8px; align-items: center; padding: 8px; }
[role="tablist"] { display: flex; overflow-x: auto; flex: 1; gap: 4px; }
button { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; white-space: nowrap; cursor: pointer; font: inherit; }
button[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 -2px var(--accent); }
button:focus-visible, pre:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
main { flex: 1; min-height: 0; overflow: auto; } section { min-height: 100%; }
pre.shiki { margin: 0; padding: 16px; min-height: 100%; width: max-content; min-width: 100%; font: 13px/1.6 Consolas, 'SFMono-Regular', monospace; tab-size: 4; counter-reset: line; background: var(--bg); color: var(--fg); }
.line::before { counter-increment: line; content: counter(line); display: inline-block; width: 4ch; margin-right: 2ch; text-align: right; color: #8b949e; user-select: none; }
html[data-theme="dark"] .shiki, html[data-theme="dark"] .shiki span { color: var(--shiki-dark, var(--fg)) !important; background-color: var(--shiki-dark-bg, var(--bg)) !important; }
@media (prefers-color-scheme: dark) { html:not([data-theme="light"]) .shiki, html:not([data-theme="light"]) .shiki span { color: var(--shiki-dark, var(--fg)) !important; background-color: var(--shiki-dark-bg, var(--bg)) !important; } }
#highlight-status { margin: 0; padding: 4px 12px; border-bottom: 1px solid var(--border); }
#copy-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
[hidden] { display: none !important; }
</style></head><body>
<header><div role="tablist" aria-label="Source files"></div><button id="copy" aria-label="Copy current source file">Copy</button></header>
<p id="highlight-status" role="status" aria-live="polite">Loading syntax highlighting…</p>
<main></main><span id="copy-status" role="status" aria-live="polite"></span>
<script>
const files = /*SOURCE_FILES*/[];
const tabs = [];
const panels = [];
const highlighted = new Set();
const highlighting = new Map();
let selected = 0;
let highlighterPromise;
function getHighlighter() {
  if (!highlighterPromise) {
    highlighterPromise = Promise.all([
      import('https://esm.sh/shiki@4.5.0'),
      import('https://esm.sh/shiki@4.5.0/engine/javascript')
    ]).then(([shiki, engine]) => shiki.createHighlighter({
      themes: ['github-light', 'github-dark'], langs: ['xml', 'csharp', 'json'],
      engine: engine.createJavaScriptRegexEngine()
    }));
    highlighterPromise.catch(() => { highlighterPromise = null; });
  }
  return highlighterPromise;
}
function setHighlightStatus(message) {
  const status = document.getElementById('highlight-status');
  status.textContent = message;
  status.hidden = !message;
}
function renderPlain(panel, text) {
  const pre = document.createElement('pre'); pre.className = 'shiki'; pre.tabIndex = 0;
  const code = document.createElement('code');
  text.split(/\r?\n/).forEach((line, i) => {
    if (i) code.appendChild(document.createTextNode('\n'));
    const span = document.createElement('span'); span.className = 'line'; span.textContent = line;
    code.appendChild(span);
  });
  pre.appendChild(code); panel.appendChild(pre);
}
async function highlight(index) {
  if (highlighted.has(index)) { setHighlightStatus(''); return; }
  setHighlightStatus('Loading syntax highlighting…');
  if (!highlighting.has(index)) {
    const work = (async () => {
      // Yield to paint the readable source before loading or highlighting a large file.
      await new Promise(resolve => setTimeout(resolve, 0));
      const highlighter = await getHighlighter();
      panels[index].innerHTML = highlighter.codeToHtml(files[index].text, {
        lang: files[index].language, themes: { light: 'github-light', dark: 'github-dark' }
      });
      highlighted.add(index);
    })();
    highlighting.set(index, work);
  }
  try {
    await highlighting.get(index);
    if (selected === index) setHighlightStatus('');
  } catch (error) {
    console.error('Source highlighting:', error);
    if (selected === index) setHighlightStatus('Syntax highlighting is unavailable. Source and Copy remain available; reselect a file to retry.');
  } finally { highlighting.delete(index); }
}
function selectFile(index, focus) {
  selected = index;
  tabs.forEach((tab, i) => { tab.setAttribute('aria-selected', String(i === index)); tab.tabIndex = i === index ? 0 : -1; panels[i].hidden = i !== index; });
  document.querySelector('main').scrollTo(0, 0);
  if (focus) tabs[index].focus();
  void highlight(index);
}
files.forEach((file, i) => {
  const tab = document.createElement('button');
  tab.id = 'tab-' + i; tab.setAttribute('role', 'tab'); tab.setAttribute('aria-controls', 'file-' + i);
  tab.setAttribute('aria-selected', String(i === 0)); tab.tabIndex = i === 0 ? 0 : -1;
  tab.textContent = file.name; document.querySelector('[role="tablist"]').appendChild(tab); tabs.push(tab);
  const panel = document.createElement('section'); panel.id = 'file-' + i; panel.setAttribute('role', 'tabpanel');
  panel.setAttribute('aria-labelledby', tab.id); panel.hidden = i !== 0; renderPlain(panel, file.text);
  document.querySelector('main').appendChild(panel); panels.push(panel);
  tab.addEventListener('click', () => selectFile(i, false));
  tab.addEventListener('keydown', event => {
    const next = event.key === 'ArrowRight' ? (i + 1) % tabs.length : event.key === 'ArrowLeft' ? (i + tabs.length - 1) % tabs.length : event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : -1;
    if (next >= 0) { event.preventDefault(); selectFile(next, true); }
  });
});
document.getElementById('copy').addEventListener('click', async () => {
  try {
    try { await navigator.clipboard.writeText(files[selected].text); }
    catch {
      const input = document.createElement('textarea'); input.value = files[selected].text; input.style.position = 'fixed'; input.style.opacity = '0'; document.body.appendChild(input); input.select();
      let copied; try { copied = document.execCommand('copy'); } finally { input.remove(); }
      if (!copied) throw new Error('Copy unavailable');
    }
    document.getElementById('copy-status').textContent = 'Copied ' + files[selected].name;
  } catch { document.getElementById('copy-status').textContent = 'Copy unavailable. Select the code and copy it manually.'; }
});
if (files.length) void highlight(0);
</script></body></html>
