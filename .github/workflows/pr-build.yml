name: PR build
run-name: PR build - ${{ github.event.pull_request.title }}

# Checks that a pull request does not break the build: the deployable WebAssembly site, built and
# checked exactly as for vnext and main, and every platform the samples browser and the standalone
# samples target. It deploys nothing and uses no secrets.
on:
  pull_request:
    branches: [vnext, main]
    # Markdown never reaches a build, as in build-and-deploy.yml.
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The build job of build-and-deploy.yml as this pull request changes it: AOT publish, the sample
  # link and source-viewer checks, and the deployable-site validation. Its dispatch job is skipped.
  webassembly-site:
    uses: ./.github/workflows/build-and-deploy.yml

  # Reads the target framework from the samples browser, so the matrix follows a framework change
  # in the pull request itself, and picks the projects to build on every platform.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      net: ${{ steps.plan.outputs.net }}
      samples: ${{ steps.plan.outputs.samples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # the merge commit and its first parent, the base branch

      - name: Plan the platform builds
        id: plan
        shell: bash
        run: |
          net=$(grep -o -m 1 -E 'net[0-9]+\.[0-9]+-browserwasm' browser/SamplesBrowser/SamplesBrowser.csproj | sed 's/-browserwasm$//')
          if [ -z "$net" ]; then echo "::error::SamplesBrowser.csproj has no browserwasm target framework."; exit 1; fi
          # Three samples from different packages, plus up to five that this pull request changes.
          samples="charts/category-chart/overview grids/data-grid/binding-local-data maps/geo-map/binding-data-csv"
          changed=$(git diff --name-only HEAD^1 HEAD -- samples | cut -d/ -f2-4 | sort -u |
            while read -r s; do [ -f "samples/$s/Sample.csproj" ] && echo "$s"; done)
          count=$(printf '%s\n' "$changed" | grep -c . || true)
          if [ "$count" -gt 5 ]; then
            echo "::notice::This pull request changes $count samples; the platform builds cover the first 5 of them. The samples browser compiles every sample."
          fi
          for s in $(printf '%s\n' "$changed" | head -n 5); do
            case " $samples " in *" $s "*) ;; *) samples="$samples $s" ;; esac
          done
          echo "Target framework: $net; samples: $samples"
          { echo "net=$net"; echo "samples=$samples"; } >> "$GITHUB_OUTPUT"

  platforms:
    needs: plan
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The samples browser targets android, browserwasm and desktop; its browserwasm build is
          # webassembly-site. The standalone samples also list ios and maccatalyst, but they have no
          # Platforms/iOS or Platforms/MacCatalyst files (Info.plist and the app entry point), so
          # those builds fail; add the platforms to scripts/uno-template and the samples, then add
          # ios and maccatalyst here on macos-15 (Xcode 16.4 for net9.0, 26.0.1 for net10.0).
          - platform: android
            os: ubuntu-24.04
            workload: android
            browser: true
          - platform: desktop
            os: ubuntu-24.04
            browser: true
          - platform: browserwasm
            os: ubuntu-24.04
            workload: wasm-tools
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TFM: ${{ needs.plan.outputs.net }}-${{ matrix.platform }}
      SAMPLES: ${{ needs.plan.outputs.samples }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the ${{ matrix.workload }} workload
        if: matrix.workload
        run: dotnet workload install ${{ matrix.workload }} --skip-manifest-update

      - name: Build the samples browser
        if: matrix.browser
        run: dotnet build browser/SamplesBrowser/SamplesBrowser.csproj -c Debug -f "$TFM" "-p:TargetFrameworks=$TFM"

      - name: Build standalone samples
        shell: bash
        run: |
          for s in $SAMPLES; do
            echo "::group::$s ($TFM)"
            dotnet build "samples/$s/Sample.csproj" -c Debug -f "$TFM" "-p:TargetFrameworks=$TFM" || { echo "::endgroup::"; echo "::error::$s failed to build for $TFM"; exit 1; }
            echo "::endgroup::"
          done
